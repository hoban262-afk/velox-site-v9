name: Auto-merge daily guide branches

# Every day the content automation pushes a new `claude/**` branch with one
# guide article. This workflow opens a PR into main and merges it automatically
# once checks pass, so guides reach production without manual clicking.

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Skip if a PR for this branch already exists
          existing=$(gh pr list --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number' --repo "$REPO")
          if [ -z "$existing" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "$(git log -1 --pretty=%s)" \
              --body "Automated daily guide. Auto-merges once checks pass." \
              --repo "$REPO"
          fi
          # Prefer native auto-merge (waits for required checks); fall back to
          # an immediate squash merge if auto-merge isn't enabled on the repo.
          gh pr merge "$BRANCH" --auto --squash --delete-branch --repo "$REPO" \
            || gh pr merge "$BRANCH" --squash --delete-branch --repo "$REPO"
