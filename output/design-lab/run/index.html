<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peptide Design — Velox Design Lab | Velox Peptides</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#030407">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    :root{ --g:#01D3A0; --g2:#6cf7d6; --bg:#030407; --bg2:#0a0d12; --bg3:#0e141b; --brd:#1a2230; --mut:#8aa0a0; --dim:#475262; --vio:#7b8cff; --amber:#f0b03b; --red:#f0637e; }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); color:#eef3f2; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }

    /* Header */
    .dlh{ border-bottom:1px solid #11181f; padding:13px 20px; display:flex; align-items:center; gap:14px; }
    .dlh img{ height:26px; }
    .dlh .nm{ font-family:'Barlow Condensed',sans-serif; font-weight:900; text-transform:uppercase; letter-spacing:.5px; font-size:17px; }
    .dlh .nm span{ color:var(--g); }
    .dlh .acc{ margin-left:auto; font-size:13px; color:var(--mut); text-decoration:none; }
    .dlh .acc:hover{ color:var(--g); }

    /* Wrap */
    .wrap{ max-width:820px; margin:0 auto; padding:32px 20px 80px; }

    /* CTA banner */
    .cta-banner{ background:linear-gradient(135deg,rgba(1,211,160,.12),rgba(123,140,255,.08)); border:1px solid rgba(1,211,160,.3); border-radius:14px; padding:20px 22px; margin-bottom:28px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
    .cta-banner .cb-text{ flex:1; min-width:200px; }
    .cta-banner .cb-text h3{ margin:0 0 4px; font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:20px; text-transform:uppercase; }
    .cta-banner .cb-text h3 span{ color:var(--g); }
    .cta-banner .cb-text p{ margin:0; font-size:13px; color:var(--mut); line-height:1.5; }
    .cta-banner .cb-btn{ background:var(--g); color:#04140f; font-size:14px; font-weight:800; padding:11px 22px; border-radius:9px; text-decoration:none; white-space:nowrap; flex-shrink:0; }

    /* Shared badge */
    .shared-badge{ display:inline-flex; align-items:center; gap:8px; font-family:'DM Mono',monospace; font-size:11px; color:var(--vio); border:1px solid rgba(123,140,255,.3); background:rgba(123,140,255,.07); padding:5px 12px; border-radius:20px; margin-bottom:16px; }

    /* Title area */
    .run-title{ font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:32px; text-transform:uppercase; letter-spacing:-.3px; margin:0 0 4px; line-height:1.05; }
    .run-title span{ color:var(--g); }
    .run-target{ font-size:15px; color:var(--mut); line-height:1.6; margin:0 0 6px; max-width:640px; }
    .run-meta{ font-family:'DM Mono',monospace; font-size:11px; color:var(--dim); margin-bottom:24px; }

    /* Brief card */
    .brief-card{ background:var(--bg3); border:1px solid var(--brd); border-radius:12px; padding:16px 18px; margin-bottom:20px; }
    .brief-card .bc-lbl{ font-family:'DM Mono',monospace; font-size:10px; color:var(--mut); letter-spacing:1px; margin-bottom:8px; }
    .brief-card p{ margin:0 0 8px; font-size:14px; line-height:1.55; }
    .tag{ display:inline-block; font-family:'DM Mono',monospace; font-size:10px; padding:3px 9px; border-radius:5px; margin:3px 4px 0 0; border:1px solid var(--brd); color:var(--mut); }
    .tag.g{ color:var(--g); border-color:rgba(1,211,160,.3); }

    /* Candidate card */
    .cand{ margin-top:16px; background:var(--bg2); border:1px solid var(--brd); border-radius:14px; padding:20px; opacity:0; transform:translateY(12px); animation:cardIn .5s cubic-bezier(.2,.9,.25,1) forwards; transition:border-color .2s,box-shadow .2s,transform .2s; }
    .cand:not(.open):hover{ border-color:#2a3645; box-shadow:0 18px 44px -28px rgba(0,0,0,.9); transform:translateY(-2px); }
    @keyframes cardIn{ to{ opacity:1; transform:none; } }
    .cand.top{ border-color:rgba(1,211,160,.55); box-shadow:0 0 0 1px rgba(1,211,160,.35) inset,0 22px 60px -30px rgba(1,211,160,.55); background:linear-gradient(180deg,rgba(1,211,160,.05),var(--bg2) 60%); }
    .crown{ display:inline-flex; align-items:center; gap:6px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; color:#04140f; background:var(--g); padding:3px 10px; border-radius:6px; font-weight:700; margin-bottom:10px; }
    .cand-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .cand-id{ font-family:'DM Mono',monospace; font-size:10px; color:var(--mut); }
    .cand-name{ font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:700; color:#fff; margin:2px 0 8px; }
    .cand-comp{ font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:30px; line-height:1; }
    .nov{ font-family:'DM Mono',monospace; font-size:10px; padding:3px 9px; border-radius:5px; }
    .nov.novel{ background:rgba(1,211,160,.1); color:var(--g); border:1px solid rgba(1,211,160,.25); }
    .nov.partial{ background:rgba(240,176,59,.1); color:var(--amber); border:1px solid rgba(240,176,59,.25); }
    .nov.known{ background:rgba(240,99,126,.1); color:var(--red); border:1px solid rgba(240,99,126,.25); }
    .badge-amphi{ font-family:'DM Mono',monospace; font-size:10px; padding:3px 9px; border-radius:5px; margin-left:5px; background:rgba(123,140,255,.1); color:var(--vio); border:1px solid rgba(123,140,255,.25); }
    .seq-cap{ font-size:11px; color:var(--mut); margin:10px 0 4px; }
    .seq{ font-family:'DM Mono',monospace; font-size:17px; letter-spacing:4px; padding:12px 14px; background:#05070a; border:1px solid var(--brd); border-radius:7px; margin:10px 0; overflow-x:auto; }
    .seq span{ display:inline-block; opacity:0; transform:translateY(-5px); animation:aaIn .3s ease forwards; }
    @keyframes aaIn{ to{ opacity:1; transform:none; } }
    .summary{ font-size:14px; color:#dfe6e4; line-height:1.55; margin:10px 0 2px; }

    /* Toggle */
    .cand-toggle{ width:100%; margin-top:12px; background:#101822; border:1px solid #283341; color:#cdd6d4; font-family:Inter,sans-serif; font-size:13px; font-weight:600; padding:11px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s; }
    .cand-toggle:hover{ border-color:var(--g); color:var(--g); }
    .cand-toggle .chev{ transition:transform .35s; font-size:11px; }
    .cand.open .cand-toggle .chev{ transform:rotate(180deg); }
    .cand-more{ overflow:hidden; max-height:0; opacity:0; transition:max-height .5s ease,opacity .4s ease,margin-top .3s ease; }
    .cand.open .cand-more{ max-height:2800px; opacity:1; margin-top:14px; }

    /* Blocks */
    .blk{ border-radius:10px; padding:13px 14px; margin-top:10px; font-size:13.5px; line-height:1.6; color:#cdd6d4; border:1px solid var(--brd); background:var(--bg3); }
    .blk h4{ margin:0 0 7px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:7px; }
    .blk.match{ background:rgba(1,211,160,.06); border-color:rgba(1,211,160,.22); }
    .blk.match h4{ color:var(--g); }
    .blk.brain h4{ color:#9fb0c9; }
    .blk ul{ margin:0; padding:0; list-style:none; display:grid; gap:8px; }
    .blk li{ position:relative; padding-left:20px; }

    /* Pros/cons */
    .prosCons{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:11px; }
    @media(max-width:560px){ .prosCons{ grid-template-columns:1fr; } }
    .pc{ border-radius:9px; padding:12px 13px; border:1px solid var(--brd); }
    .pc.pro{ background:rgba(1,211,160,.05); border-color:rgba(1,211,160,.22); }
    .pc.con{ background:rgba(240,176,59,.05); border-color:rgba(240,176,59,.22); }
    .pc h4{ margin:0 0 8px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; }
    .pc.pro h4{ color:var(--g); }
    .pc.con h4{ color:var(--amber); }
    .pc ul{ margin:0; padding:0; list-style:none; display:grid; gap:7px; }
    .pc li{ font-size:12.5px; line-height:1.5; color:#cdd6d4; padding-left:18px; position:relative; }
    .pc.pro li::before{ content:"✓"; position:absolute; left:0; color:var(--g); font-weight:700; }
    .pc.con li::before{ content:"!"; position:absolute; left:1px; color:var(--amber); font-weight:700; }

    /* Score bars */
    .bars-cap{ font-size:11px; color:var(--mut); margin:14px 0 6px; }
    .bars{ display:grid; gap:6px; }
    .bar{ display:flex; align-items:center; gap:10px; }
    .bar-l{ font-family:'DM Mono',monospace; font-size:10px; color:var(--mut); width:130px; flex-shrink:0; }
    .bar-t{ flex:1; height:3px; background:var(--brd); border-radius:2px; }
    .bar-f{ height:100%; border-radius:2px; width:0 !important; transition:width .9s cubic-bezier(.2,.8,.2,1); }
    .bar-f.fill{ width:var(--w) !important; }
    .bar-v{ font-family:'DM Mono',monospace; font-size:10px; width:26px; text-align:right; }

    /* Hypothesis */
    .hyp{ margin-top:10px; padding:9px 11px; background:rgba(123,140,255,.08); border:1px solid rgba(123,140,255,.2); border-radius:6px; font-size:12px; color:var(--vio); line-height:1.5; }
    .meta-line{ font-family:'DM Mono',monospace; font-size:10px; color:var(--dim); margin-top:9px; }

    /* Order button */
    .order-btn{ display:inline-block; background:rgba(123,140,255,.1); border:1px solid rgba(123,140,255,.3); color:var(--vio); border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; text-decoration:none; margin-top:12px; transition:.15s; }
    .order-btn:hover{ background:rgba(123,140,255,.2); }

    /* Error / not found */
    .err-card{ text-align:center; padding:60px 20px; }
    .err-card h2{ font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:28px; text-transform:uppercase; margin:0 0 10px; }
    .err-card p{ color:var(--mut); font-size:15px; margin:0 0 24px; }
    .back-link{ display:inline-block; background:var(--g); color:#04140f; font-size:15px; font-weight:800; padding:13px 26px; border-radius:10px; text-decoration:none; }

    /* Spin */
    .spin{ text-align:center; color:var(--mut); padding:60px 20px; font-family:'DM Mono',monospace; }

    /* Footer */
    .foot{ border-top:1px solid #11181f; padding:20px; text-align:center; color:var(--dim); font-size:11px; line-height:1.7; }
    .foot a{ color:var(--mut); }

    @media(prefers-reduced-motion:reduce){
      .cand,.seq span{ animation:none !important; opacity:1 !important; transform:none !important; }
      .bar-f{ transition:none; }
    }
  </style>
</head>
<body>
<div class="dlh">
  <a href="/" aria-label="Velox Peptides"><img src="/assets/images/veloxpeps2.png" alt="Velox Peptides"></a>
  <span class="nm">VELOX <span>DESIGN LAB</span></span>
  <a class="acc" href="/account/">My account</a>
</div>

<div class="wrap">
  <div id="main"><div class="spin">Loading design…</div></div>
</div>

<div class="foot">
  Velox Design Lab outputs are computational predictions for in vitro research use only. Not for human or veterinary use.<br>
  CRP Labs Ltd &middot; NI738125 &middot; <a href="/design-lab/">About Design Lab</a> &middot; <a href="/legal/research-use-policy/">Research Use Policy</a>
</div>

<script>
(function(){
'use strict';
var $=function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var AA_POS=new Set('KRH'),AA_NEG=new Set('DE'),AA_HYD=new Set('AILMFWPV');
function aaCol(a){ return AA_POS.has(a)?'#01D3A0':AA_NEG.has(a)?'#f0637e':AA_HYD.has(a)?'#7b8cff':'#8aa0a0'; }
function scoreCol(s){ return s>=75?'#01D3A0':s>=55?'#7b8cff':'#f0b03b'; }
function seqHTML(seq){ return String(seq).split('').map(function(a){ return '<span style="color:'+aaCol(a)+'">'+esc(a)+'</span>'; }).join(''); }
function barHTML(label,val,col){ return '<div class="bar"><span class="bar-l">'+label+'</span><div class="bar-t"><div class="bar-f" style="--w:'+val+'%;background:'+col+'"></div></div><span class="bar-v" style="color:'+col+'">'+val+'</span></div>'; }
function listHTML(arr){ return (arr||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join(''); }
function countUp(el,to){ to=+to||0; var dur=700,st=null; function fr(ts){ if(!st)st=ts; var p=Math.min(1,(ts-st)/dur); var e=1-Math.pow(1-p,3); el.textContent=Math.round(to*e); if(p<1) requestAnimationFrame(fr); else el.textContent=to; } requestAnimationFrame(fr); }

// Molecular (same as app page, needed for display)
var PKA={D:3.65,E:4.25,C:8.18,Y:10.07,H:6.0,K:10.53,R:12.48,nTerm:9.6,cTerm:2.34};
function calcPI(seq){ function chargeAt(pH){ var c=1/(1+Math.pow(10,pH-PKA.nTerm)); c-=1/(1+Math.pow(10,PKA.cTerm-pH)); for(var i=0;i<seq.length;i++){ var a=seq[i]; if(a==='D') c-=1/(1+Math.pow(10,PKA.D-pH)); else if(a==='E') c-=1/(1+Math.pow(10,PKA.E-pH)); else if(a==='C') c-=1/(1+Math.pow(10,PKA.C-pH)); else if(a==='Y') c-=1/(1+Math.pow(10,PKA.Y-pH)); else if(a==='H') c+=1/(1+Math.pow(10,pH-PKA.H)); else if(a==='K') c+=1/(1+Math.pow(10,pH-PKA.K)); else if(a==='R') c+=1/(1+Math.pow(10,pH-PKA.R)); } return c; } var lo=0,hi=14; for(var i=0;i<150;i++){ var mid=(lo+hi)/2; if(chargeAt(mid)>0) lo=mid; else hi=mid; } return Math.round((lo+hi)/2*100)/100; }
function netChargeAt74(seq){ var c=0; for(var i=0;i<seq.length;i++){ var a=seq[i]; if(a==='K'||a==='R') c+=1; else if(a==='H') c+=1/(1+Math.pow(10,7.4-6.0)); else if(a==='D'||a==='E') c-=1; else if(a==='C') c-=1/(1+Math.pow(10,8.18-7.4)); } return Math.round(c*10)/10; }
var NEND={A:'>20 h',C:'~1.2 h',D:'~1.1 h',E:'~1 h',F:'~1.1 h',G:'>20 h',H:'~3.5 h',I:'~20 h',K:'~1.3 h',L:'~5.5 h',M:'>20 h',N:'~1.4 h',P:'unknown',Q:'~0.8 h',R:'~1 h',S:'>20 h',T:'~7.2 h',V:'>100 h',W:'~2.8 h',Y:'~2.8 h'};
function estHalfLife(seq){ return NEND[seq[0]]||'?'; }
var HM_SC={A:0.25,R:-1.76,N:-0.64,D:-0.72,C:0.04,Q:-0.69,E:-0.62,G:0.16,H:-0.40,I:0.73,L:0.53,K:-1.10,M:0.26,F:0.61,P:-0.07,S:-0.26,T:-0.18,W:0.37,Y:0.02,V:0.54};
function hydrophobicMoment(seq){ var ss=0,sc=0; for(var i=0;i<seq.length;i++){ var h=HM_SC[seq[i]]||0; var r=i*100*Math.PI/180; ss+=h*Math.sin(r); sc+=h*Math.cos(r); } return Math.sqrt(ss*ss+sc*sc)/seq.length; }
function isAmphipathic(seq){ return hydrophobicMoment(seq)>0.20; }

// ── Load ──────────────────────────────────────────────────────────────────
var params=new URLSearchParams(window.location.search);
var shareToken=params.get('r');

async function init(){
  if(!shareToken){ renderError('No design token found in the URL. Ask the person who shared this for the correct link.'); return; }
  try{
    var r=await fetch('/api/design-lab/run?r='+encodeURIComponent(shareToken));
    if(r.status===404||r.status===403){ renderError('This design link is no longer available, or sharing was turned off by the owner.'); return; }
    if(!r.ok){ renderError('Could not load this design — please try again shortly.'); return; }
    var data=await r.json();
    renderRun(data);
  }catch(e){ renderError('Network error — please try again.'); }
}

function renderError(msg){
  document.getElementById('main').innerHTML=
    '<div class="err-card">'+
      '<h2>Design not found</h2>'+
      '<p>'+esc(msg)+'</p>'+
      '<a class="back-link" href="/design-lab/">Go to Design Lab →</a>'+
    '</div>';
}

function renderRun(run){
  var b=run.brief||{}, cands=run.candidates||[];
  var dt=run.created_at?new Date(run.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
  var top=null; cands.forEach(function(c){ var v=(c.scores||{}).comp||0; if(!top||v>top.v) top={id:c.id,v:v}; });

  var html=
    '<div class="shared-badge">🔗 Shared design · read-only</div>'+
    '<div class="cta-banner">'+
      '<div class="cb-text">'+
        '<h3>Design your <span>own peptide →</span></h3>'+
        '<p>Your first design is free — no account needed. Velox Design Lab invents novel peptide candidates and explains them in plain language — no biology degree needed.</p>'+
      '</div>'+
      '<a class="cb-btn" href="/design-lab/app/">Try Design Lab free →</a>'+
    '</div>'+
    '<div class="run-title">'+(run.name?esc(run.name):'Peptide <span>Design</span>')+'</div>'+
    '<div class="run-target">'+esc(run.target||b.target_mechanism||'')+'</div>'+
    '<div class="run-meta">'+cands.length+' candidates · generated '+dt+(run.tier_at_run?' · '+esc(run.tier_at_run):'')+'</div>';

  // Brief card
  if(b.target_mechanism){
    html+='<div class="brief-card">'+
      '<div class="bc-lbl">WHAT THE AI UNDERSTOOD</div>'+
      '<p>'+esc(b.target_mechanism)+'</p>'+
      (b.desired_properties||[]).map(function(p){ return '<span class="tag g">'+esc(p)+'</span>'; }).join('')+
      (b.reference_compounds&&b.reference_compounds.length?'<div style="margin-top:6px"><span style="font-size:11px;color:var(--mut)">References: </span>'+(b.reference_compounds||[]).map(function(r){ return '<span class="tag">'+esc(r)+'</span>'; }).join('')+'</div>':'')+
    '</div>';
  }

  // Candidate cards
  cands.forEach(function(c,ci){
    var sc=c.scores||{}, nv=c.novelty||{};
    var novCls=nv.badge==='novel'?'novel':nv.badge==='known'?'known':'partial';
    var novTxt=nv.badge==='novel'?'✦ Likely brand-new':nv.badge==='known'?'⚠ Already exists':'~ '+esc(nv.label||'Partially similar');
    var isTop=top&&c.id===top.id&&cands.length>1;
    var style=c.style||c.scaffold_class||'';
    var summary=c.plain_summary||c.rationale||'';
    var helpList=c.how_it_helps||c.strengths||[];
    var riskList=c.why_might_not||c.watch_outs||[];
    var seq=c.sequence||'';
    var amphi=isAmphipathic(seq);
    var nc=netChargeAt74(seq);
    var ncStr=nc>0?'+'+nc:String(nc);
    var pi=calcPI(seq);
    var hl=estHalfLife(seq);
    var gravyStr=sc.gravyScore!==undefined?sc.gravyScore:0;

    html+='<div class="cand'+(isTop?' top':'')+'" id="cand-'+ci+'">'+
      (isTop?'<div class="crown">👑 BEST MATCH · highest overall score</div>':'')+
      '<div class="cand-top">'+
        '<div>'+
          '<div class="cand-id">'+esc(c.id||'')+' · '+seq.length+' building blocks</div>'+
          '<div class="cand-name">'+esc(c.name||'Candidate')+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div class="cand-comp" data-to="'+(sc.comp||0)+'" style="color:'+scoreCol(sc.comp||0)+'">'+(sc.comp||0)+'</div>'+
          '<div style="font-family:\'DM Mono\',monospace;font-size:9px;color:var(--mut)">SCORE /100</div>'+
        '</div>'+
      '</div>'+
      '<div style="margin:6px 0">'+
        '<span class="nov '+novCls+'">'+novTxt+'</span>'+
        (amphi?'<span class="badge-amphi">⟨⟩ amphipathic</span>':'')+
        (style?' <span class="tag">'+esc(style)+'</span>':'')+
      '</div>'+
      '<div class="seq-cap">The recipe — each letter is one building block:</div>'+
      '<div class="seq">'+seqHTML(seq)+'</div>'+
      (summary?'<div class="summary">'+esc(summary)+'</div>':'')+

      '<div class="cand-more">'+
        (c.relates_to_request?'<div class="blk match"><h4>🔎 Why this matches the research goal</h4>'+esc(c.relates_to_request)+'</div>':'')+
        (helpList.length||riskList.length?
          '<div class="prosCons">'+
            (helpList.length?'<div class="pc pro"><h4>✓ Strengths</h4><ul>'+listHTML(helpList)+'</ul></div>':'')+
            (riskList.length?'<div class="pc con"><h4>⚠ Watch-outs</h4><ul>'+listHTML(riskList)+'</ul></div>':'')+
          '</div>':'')+
        '<div class="bars-cap">Score breakdown (out of 100):</div>'+
        '<div class="bars">'+
          barHTML('Easy to synthesise',sc.sy||0,'#01D3A0')+
          barHTML('Dissolves in water',sc.so||0,'#7b8cff')+
          barHTML('Ideal length',sc.ls||0,'#f0b03b')+
          barHTML('Building block variety',sc.dv||0,'#8aa0a0')+
        '</div>'+
        // Mini molecular summary (no helical wheel on share view — keeps it lean)
        '<div class="meta-line" style="margin-top:12px">'+
          'pI: '+pi+' · Net charge (pH 7.4): '+ncStr+' · Est. half-life: '+esc(hl)+
          ' · GRAVY: '+gravyStr+' · Protease risk: '+esc(sc.protRisk||'Low')+
          ' · Est. synthesis cost: ~£'+esc(sc.cost||'?')+
        '</div>'+
        (c.design_reasoning?'<div class="blk brain"><h4>🧠 Why the AI chose these exact building blocks</h4>'+esc(c.design_reasoning)+'</div>':'')+
        (c.research_hypothesis?'<div class="hyp"><b style="font-family:\'DM Mono\',monospace;font-size:10px;opacity:.7">🔬 WHAT A LAB MIGHT SEE · </b>'+esc(c.research_hypothesis)+'</div>':'')+
        '<a class="order-btn" href="/design-lab/order/?seq='+encodeURIComponent(seq)+'&name='+encodeURIComponent(c.name||c.id||'')+'" target="_blank">⚗ Request synthesis of this peptide →</a>'+
      '</div>'+

      '<button class="cand-toggle" type="button"><span class="lbl">Tap to see the full story</span> <span class="chev">▾</span></button>'+
    '</div>';
  });

  // Bottom CTA
  html+='<div style="text-align:center;margin-top:36px;padding:28px;background:var(--bg3);border:1px solid rgba(1,211,160,.2);border-radius:14px">'+
    '<div style="font-family:\'Barlow Condensed\',sans-serif;font-weight:900;font-size:24px;text-transform:uppercase;margin-bottom:8px">Want to design <span style="color:var(--g)">your own?</span></div>'+
    '<div style="color:var(--mut);font-size:14px;margin-bottom:18px">Your first design is free — no account, no commitment.</div>'+
    '<a href="/design-lab/app/" style="display:inline-block;background:var(--g);color:#04140f;font-size:15px;font-weight:800;padding:13px 28px;border-radius:10px;text-decoration:none">Try Design Lab free →</a>'+
  '</div>';

  document.getElementById('main').innerHTML=html;

  // Animate cards
  document.querySelectorAll('#main .cand').forEach(function(card,i){
    card.style.animationDelay=(0.1*i)+'s';
    var comp=card.querySelector('.cand-comp');
    if(comp){ var to=comp.getAttribute('data-to'); comp.textContent='0'; setTimeout(function(){ countUp(comp,to); },100*i+300); }
    card.querySelectorAll('.seq span').forEach(function(s,j){ s.style.animationDelay=(0.1*i+0.2+j*0.025)+'s'; });
  });

  // Update page title
  if(run.name||b.target_mechanism) document.title=(run.name||b.target_mechanism.slice(0,50))+' — Velox Design Lab';
}

// Card toggle
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('.cand-toggle');
  if(!t) return;
  var card=t.closest('.cand'); if(!card) return;
  var open=card.classList.toggle('open');
  var lbl=t.querySelector('.lbl'); if(lbl) lbl.textContent=open?'Hide the details':'Tap to see the full story';
  if(open&&!card.dataset.filled){ card.dataset.filled='1'; card.querySelectorAll('.bar-f').forEach(function(b){ b.classList.add('fill'); }); }
});

init();
})();
</script>
</body>
</html>
